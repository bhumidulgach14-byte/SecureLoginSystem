<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Simple Secure Login System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Register as a new user in the system</p>
        </div>

        <!-- Inline Status & Validation Messages -->
        <div id="messageBox" class="message-box"></div>

        <!-- Registration Form -->
        <form id="registerForm" class="auth-form" novalidate>
            <!-- Email Field -->
            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input 
                    type="email" 
                    id="regEmail" 
                    placeholder="e.g., newuser@example.com" 
                    autocomplete="email"
                >
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="regPassword">Password (min. 8 characters)</label>
                <input 
                    type="password" 
                    id="regPassword" 
                    placeholder="Create a password" 
                    autocomplete="new-password"
                >
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="regConfirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="regConfirmPassword" 
                    placeholder="Re-enter your password" 
                    autocomplete="new-password"
                >
            </div>

            <!-- Show / Hide Passwords Checkbox -->
            <label class="checkbox-group">
                <input type="checkbox" id="showRegPasswordsToggle">
                <span>Show Passwords</span>
            </label>

            <!-- Submit Button -->
            <button type="submit" id="registerBtn" class="btn-primary">Register Account</button>
        </form>

        <!-- Footer Links -->
        <div class="auth-footer">
            <span>Already have an account? <a href="index.html">Login here</a></span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
