<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Simple Secure Login System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <h1>Reset Password</h1>
            <p>Create a strong new password for your account.</p>
            <p id="targetEmailText" style="margin-top: 6px; font-weight: 500; color: #2563eb;"></p>
        </div>

        <!-- Inline Feedback Message Box -->
        <div id="messageBox" class="message-box"></div>

        <!-- Reset Password Form -->
        <form id="resetForm" class="auth-form" novalidate>
            <!-- New Password Field -->
            <div class="form-group">
                <label for="newPassword">New Password (min. 8 characters)</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    placeholder="Enter new password"
                    autocomplete="new-password"
                >
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    placeholder="Re-enter your new password"
                    autocomplete="new-password"
                >
            </div>

            <!-- Show / Hide Passwords Toggle -->
            <label class="checkbox-group">
                <input type="checkbox" id="showPasswordsToggle">
                <span>Show Passwords</span>
            </label>

            <!-- Submit Button -->
            <button type="submit" id="resetBtn" class="btn-primary">Update Password</button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <a href="index.html">&larr; Cancel and Return to Login</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/reset.js"></script>
</body>
</html>
